<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Box</title>

  <style>
    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      font-family: Arial, sans-serif;
    }

    .main-box {
      width: 320px;
      padding: 20px;
      background-color: #d8d1f0;
      border-radius: 20px;
    }

    .main-box h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #1f2a50;
    }

    .inner-box {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
    }

    .inner-box h1 {
      margin: 0;
      font-size: 32px;
      font-weight: bold;
    }

    .inner-box p {
      margin-top: 8px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>
<body>

<div class="main-box">
  <h2>Highest &<br>Average CTC</h2>

  <div class="inner-box">
    <h1>₹36 LPA</h1>
    <p>Highest CTC</p>
  </div>

  <div class="inner-box">
    <h1>₹6.1 LPA</h1>
    <p>Average CTC</p>
  </div>

  <div class="inner-box">
    <h1>60%</h1>
    <p>Expected Increase in Salary Potential</p>
  </div>
</div>

</body>
</html>
