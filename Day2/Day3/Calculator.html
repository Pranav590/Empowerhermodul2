<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Masai Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
        }

        .calculator {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 8px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .btn {
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .orange {
            background-color: #ff8c42;
            color: white;
        }

        .black {
            background-color: #000;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="btn orange">C</div>
        <div class="btn">/</div>
        <div class="btn">*</div>
        <div class="btn">-</div>

        <div class="btn">9</div>
        <div class="btn">8</div>
        <div class="btn">7</div>
        <div class="btn black">+</div>

        <div class="btn">6</div>
        <div class="btn">5</div>
        <div class="btn">4</div>
        <div class="btn black">=</div>

    </div>

</body>
</html>
