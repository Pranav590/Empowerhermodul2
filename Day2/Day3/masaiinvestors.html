<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Masai Investors Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 300px);
            gap: 20px;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .info {
            padding: 10px 5px;
        }

        .name {
            font-size: 18px;
            font-weight: bold;
        }

        .role {
            font-size: 14px;
            margin: 5px 0;
            color: gray;
        }

        .logo {
            height: 25px;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <h1>Masai Investors</h1>

    <div class="grid-container">

        <!-- Investor 1 -->
        <div class="card">
            <img src="https://cdn.masaischool.com/masai-website/Vijay_Shekhar_Sharma_Paytm_96f52579b8.jpg"alt="">
            <div class="info">
                <div class="name">Vijay Shekhar Sharma</div>
                <div class="role">Founder & CEO</div>
                <img class="logo" src="https://cdn.masaischool.com/masai-website/paytm_rect_06df45a24f.svg" alt="">
            </div>
        </div>

        <!-- Investor 2 -->
        <div class="card">
            <img src="https://cdn.masaischool.com/masai-website/Rectangle_427_637d69bb57.png" alt="">
            <div class="info">
                <div class="name">Kunal Shah</div>
                <div class="role">Founder, CRED</div>
                <img class="logo" src="https://cdn.masaischool.com/masai-website/cred_0a47d7b4f8.png" alt="">
            </div>
        </div>

        <!-- Investor 3 -->
        <div class="card">
            <img src="https://cdn.masaischool.com/masai-website/amrish_rau_pine_labs_144e5e587c.jpg" alt="">
            <div class="info">
                <div class="name">Amrish Rau</div>
                <div class="role">CEO, Pine Labs</div>
                <img class="logo" src="https://cdn.masaischool.com/masai-website/pine_labs_0aa2407434.png" alt="">
            </div>
        </div>

        <!-- Investor 4 -->
        <div class="card">
            <img src="https://cdn.masaischool.com/masai-website/Sampad_swain_Instamojo_f12bf6341e.jpg" alt="">
            <div class="info">
                <div class="name">Sampad Swain</div>
                <div class="role">Co-Founder & CEO</div>
                <img class="logo" src="https://cdn.masaischool.com/masai-website/instamojo_8763e704f7.png" alt="">
            </div>
        </div>

        <!-- Investor 5 -->
        <div class="card">
            <img src="https://cdn.masaischool.com/masai-website/Ankush_Sachdeva_Sharechat_4e44dbbe6b.jpg" alt="">
            <div class="info">
                <div class="name">Ankush Sachdeva</div>
                <div class="role">Co-Founder & CEO</div>
                <img class="logo" src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg" alt="">
            </div>
        </div>

        <!-- Investor 6 -->
        <div class="card">
            <img src="https://cdn.masaischool.com/masai-website/bhanu_pratap_singh_sharechat_11fdd7b47a.jpg" alt="">
            <div class="info">
                <div class="name">Bhanu Pratap Singh</div>
                <div class="role">Co-Founder & CEO</div>
                <img class="logo" src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg" alt="">
            </div>
        </div>

    </div>

</body>
</html>
