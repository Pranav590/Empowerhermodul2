<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masai Investors</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 90%;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
    }

    .name {
      font-size: 18px;
      margin-top: 10px;
      font-weight: bold;
    }

    .role {
      color: gray;
      font-size: 14px;
      margin-top: 5px;
    }

    .company {
      margin-top: 5px;
      font-size: 14px;
      font-weight: bold;
      color: #0077cc;
    }

  </style>
</head>

<body>

  <h1>Masai Investors</h1>

  <div class="container">

    <!-- Card 1 -->
    <div class="card">
      <img src="https://cdn.masaischool.com/masai-website/Vijay_Shekhar_Sharma_Paytm_96f52579b8.jpg" alt="">
      <div class="name">Vijay Shekhar Sharma</div>
      <div class="role">Founder & CEO</div>
      <div class="company">Paytm</div>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <img src="https://cdn.masaischool.com/masai-website/Rectangle_427_637d69bb57.png" alt="">
      <div class="name">Kunal Shah</div>
      <div class="role">Founder</div>
      <div class="company">CRED</div>
    </div>

    <!-- Card 3 -->
    <div class="card">
      <img src="https://cdn.masaischool.com/masai-website/amrish_rau_pine_labs_144e5e587c.jpg" alt="">
      <div class="name">Sandeep Tandon</div>
      <div class="role">Co-founder</div>
      <div class="company">pine-lab</div>
    </div>

    <!-- Card 4 -->
    <div class="card">
      <img src="https://cdn.masaischool.com/masai-website/Ankush_Sachdeva_Sharechat_4e44dbbe6b.jpg" alt="">
      <div class="name">Ankur Warikoo</div>
      <div class="role">Founder</div>
      <div class="company">share chat</div>
    </div>

    <!-- Card 5 -->
    <div class="card">
      <img src="https://cdn.masaischool.com/masai-website/bhanu_pratap_singh_sharechat_11fdd7b47a.jpg" alt="">
      <div class="name">Bhanu Pratap Singh</div>
      <div class="role">Co-Founder & CTO</div>
      <div class="company">share chat</div>
    </div>

    <!-- Card 6 -->
    <div class="card">
      <img src="https://cdn.masaischool.com/masai-website/sunil_rao_amazon_dfd2daa06d.jpeg" alt="">
      <div class="name">Sunil Rao</div>
      <div class="role">Country Head Strategy and Corpora</div>
      <div class="company">amazon</div>
    </div>

  </div>

</body>
</html>
