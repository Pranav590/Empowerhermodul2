<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase Box</title>

    <style>
        .container {
            width: 500px;
            height: 600px;

            margin: 10px auto;   /* centers horizontally */
            padding: 30px;

            border: 3px solid grey;
            border-radius: 12px;

            box-shadow: 0px 4px 12px rgba(0,0,0,0.25);

            display: flex;               /* centers content vertically */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container img {
            width: 60%;
            border-radius: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/smartwatch/w/x/h/-original-imahfa7xspmxemvj.jpeg" 
             alt="Product Image">

        <h2>SAMSUNG Galaxy Watch</h2>

        <p>
            A premium smartwatch with advanced health tracking, AMOLED display,
            long battery life, and fitness features.
        </p>

        <button>Buy Now</button>
    </div>

</body>
</html>
