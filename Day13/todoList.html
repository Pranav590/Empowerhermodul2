<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Todo List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #todoList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f3f3f3;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Enhanced Todo List</h2>

    <!-- Search Bar -->
    <input type="text" id="searchBar" placeholder="Search tasks..." />

    <br><br>

    <!-- Input to add new tasks -->
    <input type="text" id="taskInput" placeholder="Enter a new task">
    <button id="addBtn">Add Task</button>

    <ul id="todoList"></ul>

    <script>
        // Array to store tasks (id, text, completed)
        let tasks = [];

        // DOM elements
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const todoList = document.getElementById("todoList");
        const searchBar = document.getElementById("searchBar");

        // Load tasks from localStorage when page loads
        window.addEventListener("DOMContentLoaded", () => {
            const savedTasks = localStorage.getItem("tasks");

            if (savedTasks) {
                tasks = JSON.parse(savedTasks);
            }
            renderTasks(tasks);
        });

        // Save tasks array to localStorage
        function saveToLocalStorage() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        // Add a new task
        addBtn.addEventListener("click", () => {
            const text = taskInput.value.trim();
            if (text === "") {
                alert("Task cannot be empty!");
                return;
            }

            const newTask = {
                id: Date.now(),     // Unique ID
                text: text,
                completed: false
            };

            tasks.push(newTask);
            saveToLocalStorage();
            renderTasks(tasks);

            taskInput.value = "";
        });

        // Render tasks to the UI
        function renderTasks(taskArray) {
            todoList.innerHTML = ""; // Clear displayed list

            taskArray.forEach(task => {
                const li = document.createElement("li");

                const span = document.createElement("span");
                span.textContent = task.text;

                // Apply completed style if needed
                if (task.completed) {
                    span.classList.add("completed");
                }

                // Toggle completion on click
                span.addEventListener("click", () => {
                    task.completed = !task.completed;
                    saveToLocalStorage();
                    renderTasks(tasks);
                });

                // Delete button
                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";

                deleteBtn.addEventListener("click", () => {
                    tasks = tasks.filter(t => t.id !== task.id);
                    saveToLocalStorage();
                    renderTasks(tasks);
                });

                li.appendChild(span);
                li.appendChild(deleteBtn);
                todoList.appendChild(li);
            });
        }

        // Search tasks in real time
        searchBar.addEventListener("input", () => {
            const keyword = searchBar.value.toLowerCase();

            const filteredTasks = tasks.filter(task =>
                task.text.toLowerCase().includes(keyword)
            );

            renderTasks(filteredTasks);
        });
    </script>

</body>
</html>
