<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Notes App</title>
</head>
<body>

    <h2>User Notes</h2>

    <!-- Text area where user will write notes -->
    <textarea id="notesArea" rows="10" cols="50" placeholder="Write your notes here..."></textarea>
    <br><br>

    <!-- Buttons for saving, loading and clearing notes -->
    <button id="saveBtn">Save Notes</button>
    <button id="loadBtn">Load Notes</button>
    <button id="clearBtn">Clear Notes</button>

    <script>
        // Selecting the textarea element
        const notesArea = document.getElementById("notesArea");

        // On page load → load notes automatically if present in localStorage
        window.addEventListener("DOMContentLoaded", function () {
            const savedNotes = localStorage.getItem("userNotes");

            // If notes exist → display them in the textarea
            if (savedNotes) {
                notesArea.value = savedNotes;
            }
        });

        // Save Notes Button
        document.getElementById("saveBtn").addEventListener("click", function () {
            const notes = notesArea.value.trim(); // Remove extra spaces

            // Validation: Prevent saving empty notes
            if (notes === "") {
                alert("Please write something before saving!");
                return;
            }

            // Save to localStorage
            localStorage.setItem("userNotes", notes);
            alert("Notes saved successfully!");
        });

        // Load Notes Button
        document.getElementById("loadBtn").addEventListener("click", function () {
            const savedNotes = localStorage.getItem("userNotes");

            if (savedNotes) {
                notesArea.value = savedNotes;
                alert("Notes loaded!");
            } else {
                alert("No saved notes found!");
            }
        });

        // Clear Notes Button
        document.getElementById("clearBtn").addEventListener("click", function () {
            localStorage.removeItem("userNotes"); // Remove notes
            notesArea.value = ""; // Clear textarea
            alert("Notes cleared!");
        });
    </script>

</body>
</html>
